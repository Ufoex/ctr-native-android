name: Build PC (Linux/Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86 (32-bit)
            os: ubuntu-24.04
            force32: "ON"
            artifact: ctr_native
          - name: Linux x86-64 (64-bit)
            os: ubuntu-24.04
            force32: "OFF"
            artifact: ctr_native
          - name: Windows x86 (32-bit, MSVC)
            os: windows-latest
            msvc_arch: Win32
            force32: "ON"
            artifact: ctr_native.exe
          - name: Windows x64 (64-bit, MSVC)
            os: windows-latest
            msvc_arch: x64
            force32: "OFF"
            artifact: ctr_native.exe

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias (Linux, 64-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev libdecor-0-dev

      - name: Instalar dependencias (Linux, 32-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'ON'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxfixes-dev:i386 libxi-dev:i386 libxss-dev:i386 \
            libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libasound2-dev:i386 libpulse-dev:i386 libudev-dev:i386 libdbus-1-dev:i386 \
            libwayland-dev:i386 libdecor-0-dev:i386

      - name: Configurar (Linux, 32-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'ON'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCTR_FORCE_32BIT=ON -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_EXE_LINKER_FLAGS="-m32"

      - name: Configurar (Linux, 64-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'OFF'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCTR_FORCE_32BIT=OFF

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j"$(nproc)"

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.msvc_arch }} -DCTR_FORCE_32BIT=${{ matrix.force32 }}

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release -j

      - name: Ubicar y renombrar el binario compilado
        id: locate
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            src=$(find build -iname "${{ matrix.artifact }}" -path "*Release*" | head -1)
            plat="windows"
            ext=".exe"
          else
            src=$(find build -maxdepth 1 -iname "${{ matrix.artifact }}" | head -1)
            plat="linux"
            ext=""
          fi
          arch="${{ matrix.msvc_arch == 'x64' && 'x86_64' || (matrix.msvc_arch == 'Win32' && 'x86' || (matrix.force32 == 'ON' && 'x86' || 'x86_64')) }}"
          dst="ctr_native-${plat}-${arch}${ext}"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "name=$dst" >> "$GITHUB_OUTPUT"

      - name: Publicar binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  release:
    name: Publicar release de PC
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar todos los binarios
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear GitHub Release con los binarios de PC
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-build-${{ github.run_number }}
          name: CTR Fusion PC Build ${{ github.run_number }}
          body: |
            Build automática de PC (Linux/Windows).

            - Commit: `${{ github.sha }}`
            - Arquitecturas: `x86` (32-bit), `x86_64` (64-bit) por cada sistema
          prerelease: true
          files: dist/*
