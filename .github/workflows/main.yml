name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Conceder permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Release
        working-directory: android
        env:
          ANDROID_NDK_VERSION: 26.3.11579264
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: crash-ctr-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Criar GitHub Release e anexar APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Crash CTR Android Build ${{ github.run_number }}
          body: |
            Build automática do Crash CTR Android.

            - Commit: `${{ github.sha }}`
            - Arquiteturas: `armeabi-v7a`, `arm64-v8a`, `x86`
            - Tipo: Release (assinado com a keystore de debug - sem chave de release dedicada ainda)
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release.apk
